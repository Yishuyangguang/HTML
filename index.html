<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>一束阳光 - 富文本编辑器</title>

  <!-- 🌞 标签栏可爱太阳图标 (SVG Data-URI) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='24' fill='%23f59e0b'/><g stroke='%23f59e0b' stroke-width='6' stroke-linecap='round'><line x1='50' y1='10' x2='50' y2='20'/><line x1='50' y1='80' x2='50' y2='90'/><line x1='10' y1='50' x2='20' y2='50'/><line x1='80' y1='50' x2='90' y2='50'/><line x1='22' y1='22' x2='29' y2='29'/><line x1='71' y1='71' x2='78' y2='78'/><line x1='22' y1='78' x2='29' y2='71'/><line x1='71' y1='29' x2='78' y2='22'/></g><circle cx='42' cy='46' r='3.5' fill='%23ffffff'/><circle cx='58' cy='46' r='3.5' fill='%23ffffff'/><path d='M 40 56 Q 50 65 60 56' stroke='%23ffffff' stroke-width='3.5' fill='none' stroke-linecap='round'/></svg>">

  <meta name="Keywords" content="一束阳光,富文本编辑器,文章排版,图文美化,新媒体编辑">
  <meta name="Description" content="一束阳光富文本编辑器，为您提供便捷流畅的文本处理、图文排版与内容编辑工作台。">

  <!-- 🌐 UEditor 完整资源镜像（包含完整 themes/ 皮肤样式、图标与语言包） -->
  <script type="text/javascript">
    window.UEDITOR_HOME_URL = "https://cdn.jsdelivr.net/npm/vue-ueditor-wrap@3.0.7/assets/ueditor/";
  </script>
  <script type="text/javascript" charset="utf-8" src="https://cdn.jsdelivr.net/npm/vue-ueditor-wrap@3.0.7/assets/ueditor/ueditor.config.js"></script>
  <script type="text/javascript" charset="utf-8" src="https://cdn.jsdelivr.net/npm/vue-ueditor-wrap@3.0.7/assets/ueditor/ueditor.all.js"></script>
  <script type="text/javascript" charset="utf-8" src="https://cdn.jsdelivr.net/npm/vue-ueditor-wrap@3.0.7/assets/ueditor/lang/zh-cn/zh-cn.js"></script>

  <style type="text/css">
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 20px 24px 40px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      background-color: #fff;
      color: #333;
    }
    .main-container {
      width: 100%;
      margin: 0 auto;
    }
    .header-area {
      margin-bottom: 14px;
    }
    .header-area h1 {
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 6px 0;
      color: #000;
    }
    .header-area p {
      margin: 0;
      font-size: 13px;
      color: #555;
    }
    .editor-box {
      width: 100%;
      margin: 12px 0 16px 0;
    }
    .btn-row {
      margin-top: 8px;
      line-height: 28px;
    }
    button {
      background: #fff;
      border: 1px solid #ccc;
      padding: 4px 10px;
      margin: 2px 5px 2px 0;
      font-size: 13px;
      border-radius: 3px;
      cursor: pointer;
      color: #111;
      outline: none;
      transition: all 0.1s ease;
    }
    button:hover {
      background: #f0f0f0;
      border-color: #999;
    }
    button:active {
      background: #e5e5e5;
    }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      background: #fafafa;
      border-color: #ddd;
    }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="header-area">
      <h1>一束阳光 编辑器预览</h1>
      <p>一束阳光富文本编辑器，给你临时处理复制黏贴文本用。</p>
    </div>

    <!-- 编辑器挂载节点 -->
    <div class="editor-box">
      <script id="editor" type="text/plain" style="width:100%;height:450px;"></script>
    </div>

    <!-- 1:1 控制按钮区 -->
    <div id="btns">
      <div class="btn-row">
        <button onclick="getAllHtml()">获得整个html的内容</button>
        <button onclick="getContent()">获得内容</button>
        <button onclick="setContent()">写入内容</button>
        <button onclick="setContent(true)">追加内容</button>
        <button onclick="getContentTxt()">获得纯文本</button>
        <button onclick="getPlainTxt()">获得带格式的纯文本</button>
        <button onclick="hasContent()">判断是否有内容</button>
        <button onclick="setFocus()">使编辑器获得焦点</button>
        <button onmousedown="isFocus(event)">编辑器是否获得焦点</button>
        <button onmousedown="setblur(event)">编辑器失去焦点</button>
      </div>

      <div class="btn-row">
        <button onclick="getText()">获得当前选中的文本</button>
        <button onclick="insertHtml()">插入给定的内容</button>
        <button id="enable" onclick="setEnabled()">可以编辑</button>
        <button onclick="setDisabled()">不可编辑</button>
        <button onclick="UE.getEditor('editor').setHide()">隐藏编辑器</button>
        <button onclick="UE.getEditor('editor').setShow()">显示编辑器</button>
        <button onclick="UE.getEditor('editor').setHeight(300)">设置高度为300默认关闭了自动长高</button>
      </div>

      <div class="btn-row">
        <button onclick="getLocalData()">获取草稿箱内容</button>
        <button onclick="clearLocalData()">清空草稿箱</button>
      </div>
    </div>

    <div class="btn-row" style="margin-top: 10px;">
      <button onclick="createEditor()">创建编辑器</button>
      <button onclick="deleteEditor()">删除编辑器</button>
    </div>
  </div>

  <script type="text/javascript">
    // 实例化编辑器
    var ue = UE.getEditor('editor', {
      initialFrameWidth: '100%',
      initialFrameHeight: 450,
      autoHeightEnabled: true,
      elementPathEnabled: true,
      wordCount: true,
      maximumWords: 10000
    });

    function isFocus(e) {
      alert(UE.getEditor('editor').isFocus());
      UE.dom.domUtils.preventDefault(e);
    }

    function setblur(e) {
      UE.getEditor('editor').blur();
      UE.dom.domUtils.preventDefault(e);
    }

    function insertHtml() {
      var value = prompt('插入html代码', '<span style="color:#f59e0b;font-weight:bold;">一束阳光</span>');
      if (value !== null && value !== '') {
        UE.getEditor('editor').execCommand('insertHtml', value);
      }
    }

    function createEditor() {
      enableBtn();
      UE.getEditor('editor');
    }

    function getAllHtml() {
      alert(UE.getEditor('editor').getAllHtml());
    }

    function getContent() {
      var arr = [];
      arr.push("使用editor.getContent()方法可以获得编辑器的内容");
      arr.push("内容为：");
      arr.push(UE.getEditor('editor').getContent());
      alert(arr.join("\n"));
    }

    function getPlainTxt() {
      var arr = [];
      arr.push("使用editor.getPlainTxt()方法可以获得编辑器的带格式的纯文本内容");
      arr.push("内容为：");
      arr.push(UE.getEditor('editor').getPlainTxt());
      alert(arr.join("\n"));
    }

    function setContent(isAppendTo) {
      var arr = [];
      arr.push("使用editor.setContent('欢迎使用一束阳光富文本编辑器')方法可以设置编辑器的内容");
      UE.getEditor('editor').setContent('欢迎使用一束阳光富文本编辑器', isAppendTo);
      alert(arr.join("\n"));
    }

    function setDisabled() {
      UE.getEditor('editor').setDisabled('fullscreen');
      disableBtn("enable");
    }

    function setEnabled() {
      UE.getEditor('editor').setEnabled();
      enableBtn();
    }

    function getText() {
      var range = UE.getEditor('editor').selection.getRange();
      range.select();
      var txt = UE.getEditor('editor').selection.getText();
      alert(txt);
    }

    function getContentTxt() {
      var arr = [];
      arr.push("使用editor.getContentTxt()方法可以获得编辑器的纯文本内容");
      arr.push("编辑器的纯文本内容为：");
      arr.push(UE.getEditor('editor').getContentTxt());
      alert(arr.join("\n"));
    }

    function hasContent() {
      var arr = [];
      arr.push("使用editor.hasContents()方法判断编辑器里是否有内容");
      arr.push("判断结果为：");
      arr.push(UE.getEditor('editor').hasContents());
      alert(arr.join("\n"));
    }

    function setFocus() {
      UE.getEditor('editor').focus();
    }

    function deleteEditor() {
      disableBtn();
      UE.getEditor('editor').destroy();
    }

    function disableBtn(str) {
      var div = document.getElementById('btns');
      var btns = UE.dom.domUtils.getElementsByTagName(div, "button");
      for (var i = 0, btn; btn = btns[i++];) {
        if (btn.id == str) {
          UE.dom.domUtils.removeAttributes(btn, ["disabled"]);
        } else {
          btn.setAttribute("disabled", "true");
        }
      }
    }

    function enableBtn() {
      var div = document.getElementById('btns');
      var btns = UE.dom.domUtils.getElementsByTagName(div, "button");
      for (var i = 0, btn; btn = btns[i++];) {
        UE.dom.domUtils.removeAttributes(btn, ["disabled"]);
      }
    }

    function getLocalData() {
      alert(UE.getEditor('editor').execCommand("getlocaldata"));
    }

    function clearLocalData() {
      UE.getEditor('editor').execCommand("clearlocaldata");
      alert("已清空草稿箱");
    }
  </script>
</body>
</html>
